<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101719">
  <meta name="description" content="Mi Control Laboral. Tu espacio personal para organizar tu jornada. Registro personal local.">
  <meta name="color-scheme" content="dark">
  <title>Mi Control Laboral</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./css/styles.css?v=1.0.0">
  <script type="module" src="./js/app.js?v=1.0.0"></script>
</head>
<body>
  <div class="shell">
    <header class="brand"><img src="./assets/icons/icon-192.png" width="40" height="40" alt=""><span>Mi Control Laboral</span><span class="version">V1.0</span></header>
    <main id="view" tabindex="-1"><h1>Abriendo tus datos…</h1></main>
    <p id="app-status" class="app-status" role="status" hidden></p>
    <nav aria-label="Navegación principal">
      <button disabled data-section="home">Inicio</button>
      <button disabled data-section="calendar">Calendario</button>
      <button disabled data-section="summary">Resumen</button>
      <button disabled data-section="history">Historial</button>
      <button disabled data-section="settings">Configuración</button>
    </nav>
    <dialog id="editor" aria-labelledby="editor-title"><form id="record-form"><div id="editor-content"></div></form></dialog>
    <noscript><p class="app-status">Activa JavaScript para usar la aplicación y su almacenamiento local.</p></noscript>
  </div>
</body>
</html>
